[project]
name = "CodingAgentRuntime"
version = "1.0.0"
description = "Coding Agent Platform Advisor — AgentCore Runtime"
requires-python = ">=3.11"
dependencies = [
    "bedrock-agentcore>=0.1.0",
    "strands-agents>=0.1.0",
    "strands-agents-tools>=0.1.0",
    "boto3>=1.35.0",
    "botocore>=1.35.0",
    "PyJWT[crypto]>=2.8.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "moto[dynamodb]>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
