version: "3.9"

services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: platform-advisor-dynamo
    ports:
      - "8000:8000"
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8000 | grep -q 'healthy' || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 3

  dynamodb-admin:
    image: aaronshaf/dynamodb-admin:latest
    container_name: platform-advisor-dynamo-admin
    environment:
      DYNAMO_ENDPOINT: http://dynamodb-local:8000
    ports:
      - "8001:8001"
    depends_on:
      - dynamodb-local

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: platform-advisor-api
    ports:
      - "8080:8080"
    environment:
      DEV_MODE: "true"
      ENV: dev
      DYNAMODB_TABLE: platform-advisor-main
      DYNAMODB_ENDPOINT: http://dynamodb-local:8000
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      ALLOWED_ORIGINS: "http://localhost:3000"
    volumes:
      - ./backend:/var/task
      - ./knowledge-base:/var/task/../knowledge-base:ro
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8080", "--reload"]
    depends_on:
      - dynamodb-local

networks:
  default:
    name: platform-advisor-network
