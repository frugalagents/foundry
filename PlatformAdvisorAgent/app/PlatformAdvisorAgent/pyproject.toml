[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "PlatformAdvisorAgent"
version = "0.1.0"
description = "Platform Advisor — Strands agent pipeline on AgentCore Runtime"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aws-opentelemetry-distro",
    "bedrock-agentcore >= 1.9.1",
    "boto3 >= 1.35.0",
    "botocore[crt] >= 1.35.0",
    "mcp >= 1.19.0",
    "PyYAML >= 6.0.2",
    "PyJWT[crypto] >= 2.10.0",
    "strands-agents >= 1.15.0",
    "strands-agents-tools >= 0.1.0",
    "pydantic >= 2.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
