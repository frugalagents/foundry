AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Platform Advisor — Serverless backend (Lambda + API Gateway + DynamoDB + Cognito)

Globals:
  Function:
    Timeout: 900
    MemorySize: 1024
    Runtime: python3.14
    Environment:
      Variables:
        ENV: !Ref Env
        DYNAMODB_TABLE: !Ref MainTable
        COGNITO_REGION: !Ref AWS::Region
        COGNITO_USER_POOL_ID: !Ref UserPool
        COGNITO_CLIENT_ID: !Ref UserPoolClient
        ALLOWED_ORIGINS: !Ref AllowedOrigins
        DEV_MODE: !Ref DevMode
        KNOWLEDGE_BASE_ID: !Ref KnowledgeBaseId
        PLATFORM_ADVISOR_KNOWLEDGE_RELEASE_ROOT: runtime_releases
        PLATFORM_ADVISOR_KNOWLEDGE_RELEASE_PLATFORM: coding-platform
        PLATFORM_ADVISOR_KNOWLEDGE_RELEASE_VERSION: !Ref KnowledgeReleaseVersion
        PLATFORM_ADVISOR_KNOWLEDGE_RELEASE_MANIFEST_HASH: !Ref KnowledgeReleaseManifestHash

Parameters:
  Env:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
  AllowedOrigins:
    Type: String
    Default: "https://d1wa5bvm23hhld.cloudfront.net"
    Description: "Primary app URL for CORS and Cognito callback"
  DevMode:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: "Set to true only for local dev — skips Cognito JWT verification"
  AdminAlias:
    Type: String
    Default: ""
    Description: "Comma-separated existing admin aliases used only by the guarded migration preflight and temporary fallback"
  AdminGroupName:
    Type: String
    Default: "admin"
    AllowedPattern: "^[A-Za-z0-9_+=,.@-]+$"
    Description: "Administrator-managed Cognito group whose members receive Platform Advisor admin access"
  AdminAliasMigrationEnabled:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: "Temporary migration fallback; deploy true only until current administrators are enrolled in the admin group"
  MidwayClientSecret:
    Type: String
    NoEcho: true
    Description: "Client secret for the Midway OIDC app; required at deploy time and never committed"
  MidwayClientId:
    Type: String
    Default: "platform-advisor-dev"
    MinLength: 1
    Description: "Midway OIDC client ID for this environment"
  KnowledgeBaseId:
    Type: String
    Default: "EDDM8YZDNJ"
    Description: "Bedrock Knowledge Base ID for architecture decision explanations (RAG). Empty disables retrieval."
  KnowledgeReleaseVersion:
    Type: String
    Default: "1.5.0"
    AllowedPattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
    Description: "Immutable coding-platform knowledge release packaged with the API."
  KnowledgeReleaseManifestHash:
    Type: String
    Default: "sha256:0fbe1f63d216fd46ab80beed9e9f0a51d724f283974563430f98753366afef60"
    AllowedPattern: "^sha256:[0-9a-f]{64}$"
    Description: "Required content pin for the packaged knowledge release manifest."
  AgentCoreRuntimeArn:
    Type: String
    Default: ""
    AllowedPattern: "^$|^arn:(aws|aws-us-gov|aws-cn):bedrock-agentcore:[a-z0-9-]+:[0-9]{12}:runtime/[A-Za-z0-9][A-Za-z0-9_-]{0,255}$"
    Description: "AgentCore Runtime ARN allowed for authenticated browser invocation. Empty disables browser invoke permission."

Conditions:
  IsDev: !Equals [!Ref Env, dev]
  HasAgentCoreRuntimeArn: !Not [!Equals [!Ref AgentCoreRuntimeArn, ""]]

Resources:
  # ── DynamoDB Table ──────────────────────────────────────────────────────────
  MainTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !If
        - IsDev
        - platform-advisor-main
        - !Sub "platform-advisor-main-${Env}"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # ── Cognito User Pool ───────────────────────────────────────────────────────
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub platform-advisor-users-${Env}
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
      LambdaConfig:
        PreTokenGeneration: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:platform-advisor-pre-token-${Env}"
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
        # Retained for compatibility with the existing user pool. The app
        # client cannot write these attributes and authorization ignores them.
        - Name: role
          AttributeDataType: String
          Required: false
          Mutable: true
        - Name: amazon_alias
          AttributeDataType: String
          Required: false
          Mutable: true

  UserPoolAdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: !Ref AdminGroupName
      Description: Platform Advisor administrators
      Precedence: 0

  UserPoolMidwayIdP:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Properties:
      UserPoolId: !Ref UserPool
      ProviderName: Midway
      ProviderType: OIDC
      ProviderDetails:
        client_id: !Ref MidwayClientId
        client_secret: !Ref MidwayClientSecret
        oidc_issuer: https://idp-integ.federate.amazon.com
        authorize_scopes: openid email
        attributes_request_method: GET
      AttributeMapping:
        email: email
        custom:amazon_alias: sub

  UserPoolResourceServer:
    Type: AWS::Cognito::UserPoolResourceServer
    Properties:
      UserPoolId: !Ref UserPool
      Identifier: platform-advisor-api
      Name: Platform Advisor API
      Scopes:
        - ScopeName: read
          ScopeDescription: Read customer architecture workspaces
        - ScopeName: write
          ScopeDescription: Change customer architecture workspaces
        - ScopeName: admin
          ScopeDescription: Access administrator operations

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn:
      - UserPoolMidwayIdP
      - UserPoolResourceServer
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub platform-advisor-app-${Env}
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      ReadAttributes:
        - email
        - custom:amazon_alias
      WriteAttributes:
        - email
        # Required by Cognito for the Midway IdP attribute mapping. The
        # migration fallback independently anchors this value to identities.
        - custom:amazon_alias
      SupportedIdentityProviders:
        - COGNITO
        - Midway
      CallbackURLs:
        - !Sub "${AllowedOrigins}/api/auth/callback"
        - "http://localhost:3000/api/auth/callback"
      LogoutURLs:
        - !Sub "${AllowedOrigins}/login"
        - "http://localhost:3000/login"
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes:
        - email
        - openid
        - profile
        - platform-advisor-api/read
        - platform-advisor-api/write
        - platform-advisor-api/admin
      AllowedOAuthFlowsUserPoolClient: true

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub "platform-advisor-${Env}-${AWS::AccountId}"
      UserPoolId: !Ref UserPool

  # ── Cognito Identity Pool ───────────────────────────────────────────────────
  # Grants authenticated users temporary AWS credentials scoped to AgentCore only.
  # Frontend exchanges Cognito id_token for these creds to call AgentCore directly.
  IdentityPool:
    Type: AWS::Cognito::IdentityPool
    Properties:
      IdentityPoolName: !Sub platform-advisor-identity-${Env}
      AllowUnauthenticatedIdentities: false
      CognitoIdentityProviders:
        - ClientId: !Ref UserPoolClient
          ProviderName: !GetAtt UserPool.ProviderName

  IdentityPoolAuthRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub platform-advisor-identity-auth-${Env}
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: cognito-identity.amazonaws.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                "cognito-identity.amazonaws.com:aud": !Ref IdentityPool
              "ForAnyValue:StringLike":
                "cognito-identity.amazonaws.com:amr": authenticated
      Policies:
        - !If
          - HasAgentCoreRuntimeArn
          - PolicyName: AgentCoreInvokeOnly
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action:
                    - bedrock-agentcore:InvokeAgentRuntime
                    - bedrock-agentcore:InvokeAgentRuntimeForUser
                  Resource: !Ref AgentCoreRuntimeArn
          - !Ref AWS::NoValue

  IdentityPoolRoles:
    Type: AWS::Cognito::IdentityPoolRoleAttachment
    Properties:
      IdentityPoolId: !Ref IdentityPool
      Roles:
        authenticated: !GetAtt IdentityPoolAuthRole.Arn

  # ── Frontend: S3 + CloudFront ──────────────────────────────────────────────
  FrontendBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub platform-advisor-frontend-${Env}-${AWS::AccountId}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: RetainRollbackVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  FrontendOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub platform-advisor-frontend-oac-${Env}
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                "AWS:SourceArn": !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}"

  FrontendRouterFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub platform-advisor-spa-router-${Env}
      AutoPublish: true
      FunctionConfig:
        Comment: "SPA routing for Next.js static export"
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          var lastSeg = uri.split('/').pop();
          if (lastSeg && lastSeg.indexOf('.') !== -1) return request;
          if (uri.charAt(uri.length - 1) !== '/') uri = uri + '/';
          if (/^\/customers\/[^\/]+\/sessions\//.test(uri)) {
            request.uri = '/customers/_/sessions/_/index.html';
            return request;
          }
          if (/^\/customers\/[^\/]+\//.test(uri)) {
            request.uri = '/customers/_/index.html';
            return request;
          }
          request.uri = uri + 'index.html';
          return request;
        }

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub "Platform Advisor Frontend (${Env})"
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2and3
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ""
            OriginAccessControlId: !GetAtt FrontendOAC.Id
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt FrontendRouterFunction.FunctionMetadata.FunctionARN
        CacheBehaviors:
          - PathPattern: "_next/static/*"
            TargetOriginId: S3Origin
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0

  # ── Cognito PreTokenGeneration Lambda ──────────────────────────────────────
  PreTokenFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub platform-advisor-pre-token-${Env}
      CodeUri: ../backend/
      Handler: api.pre_token.handler
      Description: Cognito PreTokenGeneration trigger — injects custom:role claim
      Environment:
        Variables:
          ADMIN_GROUP: !Ref AdminGroupName
          ADMIN_ALIAS_MIGRATION_ENABLED: !Ref AdminAliasMigrationEnabled
          ADMIN_ALIASES: !Ref AdminAlias
          # Override globals to break circular dependency with UserPool/UserPoolClient
          COGNITO_USER_POOL_ID: "unused"
          COGNITO_CLIENT_ID: "unused"

  PreTokenFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt PreTokenFunction.Arn
      Action: lambda:InvokeFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPool.Arn

  # ── Lambda Function (CRUD + confirm + admin) ────────────────────────────────
  # No FunctionUrlConfig — Lambda is only reachable via API Gateway.
  AdvisorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub platform-advisor-api-${Env}
      CodeUri: .lambda-src/
      Handler: api.main.handler
      Description: Platform Advisor FastAPI backend — CRUD, confirmation, admin
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MainTable
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource: "*"
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:Retrieve
              Resource: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/*"
      Events:
        ApiProxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY
        HealthCheck:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /health
            Method: GET
            Auth:
              Authorizer: NONE
        CorsPreflight:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: OPTIONS
            Auth:
              Authorizer: NONE

  AdvisorErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "platform-advisor-api-${Env}-errors"
      AlarmDescription: "API Lambda has repeated errors in the dev rollout."
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref AdvisorFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  AdvisorThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "platform-advisor-api-${Env}-throttles"
      AlarmDescription: "API Lambda was throttled."
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref AdvisorFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  AdvisorDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "platform-advisor-api-${Env}-duration-p99"
      AlarmDescription: "API Lambda p99 duration exceeded 80 percent of its 900 second timeout."
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - Name: FunctionName
          Value: !Ref AdvisorFunction
      ExtendedStatistic: p99
      Period: 60
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      Threshold: 720000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  PreTokenErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "platform-advisor-pre-token-${Env}-errors"
      AlarmDescription: "Cognito pre-token claim generation failed."
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref PreTokenFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  # ── API Gateway HTTP API (JWT-secured) ─────────────────────────────────────
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Description: Platform Advisor REST API — Cognito JWT at the edge with Lambda verification as defense in depth
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            IdentitySource: "$request.header.Authorization"
            JwtConfiguration:
              audience:
                - !Ref UserPoolClient
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
      CorsConfiguration:
        AllowOrigins:
          - !Ref AllowedOrigins
          - "http://localhost:3000"
        AllowHeaders:
          - Content-Type
          - Authorization
        AllowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        AllowCredentials: false
      DefaultRouteSettings:
        ThrottlingBurstLimit: 100
        ThrottlingRateLimit: 50

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
    Export:
      Name: !Sub "${AWS::StackName}-ApiUrl"

  TableName:
    Description: DynamoDB table name
    Value: !Ref MainTable
    Export:
      Name: !Sub "${AWS::StackName}-TableName"

  FunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt AdvisorFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-FunctionArn"

  UserPoolId:
    Description: Cognito User Pool ID — set as NEXT_PUBLIC_USER_POOL_ID in frontend .env
    Value: !Ref UserPool
    Export:
      Name: !Sub "${AWS::StackName}-UserPoolId"

  UserPoolClientId:
    Description: Cognito App Client ID — set as NEXT_PUBLIC_COGNITO_CLIENT_ID in frontend .env
    Value: !Ref UserPoolClient
    Export:
      Name: !Sub "${AWS::StackName}-UserPoolClientId"

  UserPoolLoginUrl:
    Description: Cognito Hosted UI login URL for testing
    Value: !Sub "https://platform-advisor-${Env}-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com/login?client_id=${UserPoolClient}&response_type=code&scope=email+openid+profile&redirect_uri=${AllowedOrigins}/api/auth/callback"

  IdentityPoolId:
    Description: Cognito Identity Pool ID — set as NEXT_PUBLIC_IDENTITY_POOL_ID in frontend .env
    Value: !Ref IdentityPool
    Export:
      Name: !Sub "${AWS::StackName}-IdentityPoolId"

  FrontendURL:
    Description: CloudFront distribution URL for the frontend
    Value: !Sub "https://${FrontendDistribution.DomainName}"
    Export:
      Name: !Sub "${AWS::StackName}-FrontendURL"

  FrontendBucketName:
    Description: S3 bucket name for frontend assets
    Value: !Ref FrontendBucket
    Export:
      Name: !Sub "${AWS::StackName}-FrontendBucketName"

  FrontendDistributionId:
    Description: CloudFront distribution ID (for cache invalidation)
    Value: !Ref FrontendDistribution
    Export:
      Name: !Sub "${AWS::StackName}-FrontendDistributionId"
